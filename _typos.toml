# Null's spelling check (typos, run by lefthook's spelling job): commit hashes are not words.
[default]
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

# Misspellings the tests write on purpose, to check the suggestions.
[default.extend-words]
strat = "strat"
locaton = "locaton"
metalic = "metalic"
sampels = "sampels"
# A misspelt bevel width and zone link, as a report names the errors they give (task 1d-07a).
wdth = "wdth"
geomtry = "geomtry"
# A misspelt parameter, type and line in a component, to check their fixes (task 1d-03b).
lenght = "lenght"
materail = "materail"

# The schema and raw table Sau generates hold Blender's own names and labels (`preserve_formant`,
# DNA's `area_sizez`), not ours.
[files]
# The spec's examples written wrong on purpose, one mistake each, to show their errors (task 1d-07a).
extend-exclude = [
  "schema/null-schema-project.json",
  "schema/null-raw.json",
  "compiler/null_check/tests/spec_examples.rs",
]
