# Null's spelling check (typos, run by lefthook's spelling job): commit hashes are not words.
[default]
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

# Misspellings the tests write on purpose, to check the suggestions.
[default.extend-words]
strat = "strat"
locaton = "locaton"
metalic = "metalic"
sampels = "sampels"

# The schema Sau generates holds Blender's own names and labels (`preserve_formant`), not ours.
[files]
extend-exclude = ["schema/null-schema-project.json"]
