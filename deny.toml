# cargo-deny policy. This repository is MIT, so every dependency must be permissive (Sau's
# docs/agents/boundaries.md). MPL-2.0 is allowed only for unmodified dependencies: its copyleft
# covers only its own files. `just check` runs the licence, ban and source checks offline.

[graph]
all-features = false

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Sibling crates by path (Scowr's front end, Null from Cosmósis) are not published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Advisory checks need the network; run `cargo deny check advisories` on demand.
