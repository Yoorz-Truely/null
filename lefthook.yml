# Git hooks. Install once per clone with `just hooks`; every worktree shares them.
# Pre-commit checks only staged files; a code commit needs a passing `just check` on its very
# tree (commit-msg job `checked`).
output:
  - failure
  - summary

pre-commit:
  parallel: true
  skip:
    - merge
  jobs:
    - name: rust-format
      glob: "*.rs"
      run: rustfmt --edition 2024 {staged_files}
      stage_fixed: true

    - name: toml
      glob: "*.toml"
      run: taplo fmt {staged_files}
      stage_fixed: true

    - name: spelling
      run: typos --force-exclude {staged_files}

    - name: secrets
      run: gitleaks git --staged --no-banner --redact .

commit-msg:
  # Merges are not skipped here: `checked` itself lets a real merge through and refuses a
  # MERGE_HEAD written by hand (task 0-10).
  jobs:
    # Code is committed only on a tree `just check` passed on (task 0-10). It runs here, not in
    # pre-commit, because lefthook re-stages what the pre-commit fixers change only after every
    # pre-commit job has run; by commit-msg the index is what will be committed.
    - name: checked
      run: python3 tools/check-record.py require

    - name: message
      run: python3 tools/commit-msg.py {1}
