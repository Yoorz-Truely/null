[package]
name = "null_check"
description = "Null's checker: names, types, units and handles against the schema generated from RNA"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# One test binary for the files in tests/ (Sau task 0-26, S69): tests/main.rs.
autotests = false

[dependencies]
null_syntax.workspace = true
null_value.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = { version = "1", default-features = false }

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
