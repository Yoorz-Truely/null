[package]
name = "null_syntax"
description = "Null's syntax: Scowr's shared lexer and lossless tree, with Null's diagnostic codes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# One test binary for the files in tests/ (Sau task 0-26, S69): tests/main.rs.
autotests = false

[dependencies]
scowr_errors.workspace = true
scowr_syntax.workspace = true

[dev-dependencies]
insta = { version = "1", default-features = false }

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
