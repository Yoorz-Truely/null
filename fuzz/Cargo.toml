# Fuzz targets for Null, run by `tools/fuzz.sh` (`just verify`) with cargo-fuzz on a nightly
# toolchain. Its own workspace, so the stable gates (`just check`) never build it.
[package]
name = "null-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
null_syntax = { path = "../compiler/null_syntax" }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
